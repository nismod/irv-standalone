# ETL and Django application dependencies
# to install this environment:
# micromamba create -f environment.yml -y
name: irv-jamaica-etl
channels:
  - conda-forge # majority of dependencies
  - nodefaults # avoid anaconda license issues
dependencies:
  - python~=3.13
  - pip:
      - -r ../irvapp/requirements.txt
      - nismod-snail==0.5.3
      - snkit~=1.9.0
      - terracotta==0.9.1 # required for ETL
  - bioconda::snakemake~=8.30
  - black
  - fiona~=1.10
  - geopandas~=1.0
  - python-igraph~=0.11.6
  - matplotlib~=3.9
  - networkx~=3.3
  - numpy>=2.1
  - openpyxl~=3.1
  - pandas~=3.0
  - pathos~=0.3.2
  - pyarrow~=21.0
  - rasterio~=1.4
  - rioxarray~=0.17.0
  - SALib~=1.5
  - scipy~=1.14
  - shapely~=2.0
  - tippecanoe~=2.78
  - tqdm
  - ujson~=5.10
  - xarray~=2026.4
