# Production environment
#
# Mirrors docker-compose.dev.yml, except:
# - no traefik: nginx on the host reverse-proxies to the published ports
# - no db: the database is a separate server (RDS on AWS)
# - environment variables are read from ./envs/prod/.backend.env, which is
#   uploaded to the server (e.g. via rsync) and must not be committed
#   (see deploy/README.md for the expected contents)
volumes:
  django-media:

services:
  frontend:
    image: ghcr.io/nismod/irvapp-frontend:0.1
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"

  django:
    image: ghcr.io/nismod/irvapp-backend:0.1
    build: ./irvapp
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:8000"
    env_file:
      # PG* connection details, DJANGO_SECRET_KEY, DJANGO_DEBUG,
      # DJANGO_ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS - not committed
      - ./envs/prod/.backend.env
    environment:
      - PIXEL_STACK_DATA_DIR=/data/pixel
      - LAYER_METADATA_PATH=/data/pixel/hazard_layers.csv
      - TILEDB_URI=/data/raster
    volumes:
      - ./tileserver/stacks:/data/pixel:ro
      - ./tileserver/raster/data:/data/raster:ro
      - ./etl/hazard_layers.csv:/data/pixel/hazard_layers.csv:ro
      - ./staticfiles:/code/staticfiles
      - django-media:/code/media

  vector-tileserver:
    image: ghcr.io/nismod/jsrat-vector-tileserver:0.1
    build: ./tileserver/vector
    restart: unless-stopped
    # no published ports: django proxies to http://vector-tileserver:8080
    # over the compose network (see VECTOR_TILESERVER_INTERNAL_URL)
    volumes:
      - ./tileserver/vector/data:/data
      - ./tileserver/vector/config.json:/config.json
